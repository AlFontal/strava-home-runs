[project]
name = "strava-home-runs"
version = "0.1.0"
description = "Animate every run that started from home, each at its own pace, as a 3D video (Blender)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy", "pillow"]

[project.scripts]
homeruns = "homeruns.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["homeruns"]

# ---- pixi: Python, the packages and ffmpeg in one environment (Blender is installed separately) ----
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.11"
numpy = "*"
pillow = "*"
ffmpeg = "*"

[tool.pixi.pypi-dependencies]
strava-home-runs = { path = ".", editable = true }
